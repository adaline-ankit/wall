name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e '.[dev]'
      - run: ruff format --check .
      - run: ruff check .
      - run: mypy wall_harness
      - run: pytest --cov=wall_harness --cov-report=term-missing
      - run: pip-audit . --ignore-vuln PYSEC-2026-3552
      - run: pip check
      - run: node --check wall_harness/web/static/app.js
      - run: python -m pip wheel . --no-deps --wheel-dir dist
