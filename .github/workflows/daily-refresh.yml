name: Refresh hosted Margin

on:
  schedule:
    # 03:30 UTC is 09:00 India Standard Time. GitHub may delay scheduled jobs under load.
    - cron: "30 3 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: margin-daily-refresh
  cancel-in-progress: false

jobs:
  configuration:
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.gate.outputs.enabled }}
    env:
      MARGIN_REFRESH_URL: ${{ vars.MARGIN_REFRESH_URL }}
      MARGIN_REFRESH_TOKEN: ${{ secrets.MARGIN_REFRESH_TOKEN }}
    steps:
      - id: gate
        name: Check scoped scheduler configuration
        run: |
          if [ -z "$MARGIN_REFRESH_URL" ] || [ -z "$MARGIN_REFRESH_TOKEN" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Daily refresh is disabled until its URL variable and scoped token secret are set."
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

  refresh:
    needs: configuration
    if: ${{ needs.configuration.outputs.enabled == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      MARGIN_REFRESH_URL: ${{ vars.MARGIN_REFRESH_URL }}
      MARGIN_REFRESH_TOKEN: ${{ secrets.MARGIN_REFRESH_TOKEN }}
    steps:
      - name: Refresh the deterministic Wall inbox
        run: |
          curl --fail --show-error --silent --retry 3 --retry-all-errors \
            --retry-delay 5 --retry-max-time 180 \
            --connect-timeout 20 --max-time 60 \
            -X POST "$MARGIN_REFRESH_URL/api/reading/refresh" \
            -H "Authorization: Bearer $MARGIN_REFRESH_TOKEN" \
            -H "content-type: application/json" \
            --data '{"use_llm":false}'
