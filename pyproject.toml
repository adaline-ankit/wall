[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wall-harness"
version = "0.9.0"
description = "A local-first programmable information harness. Subscribe to intent, not feeds."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "Wall contributors" }]
keywords = ["rss", "personal-knowledge", "llm", "research", "cli"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Typing :: Typed",
]
dependencies = [
  "cryptography>=49,<50",
  "feedparser>=6.0.11,<7",
  "fastapi>=0.116,<1",
  "httpx>=0.27,<1",
  "pydantic>=2.8,<3",
  "PyYAML>=6.0.2,<7",
  "typer>=0.12,<1",
  "uvicorn>=0.35,<1",
]

[project.optional-dependencies]
dev = ["mypy>=1.11,<2", "pip-audit>=2.10,<3", "pytest>=8.3,<9", "pytest-cov>=5,<7", "ruff>=0.6,<1", "types-PyYAML>=6.0,<7"]

[project.scripts]
wall = "wall_harness.cli:app"

[project.urls]
Homepage = "https://github.com/adaline-ankit/wall"
Issues = "https://github.com/adaline-ankit/wall/issues"

[tool.hatch.build.targets.wheel]
packages = ["wall_harness"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["wall_harness"]

[[tool.mypy.overrides]]
module = "feedparser"
ignore_missing_imports = true
