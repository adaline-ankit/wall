services:
  - type: web
    name: margin-reading-ankit
    runtime: docker
    plan: starter
    region: singapore
    healthCheckPath: /healthz
    autoDeploy: true
    disk:
      name: margin-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: WALL_DATA_DIR
        value: /var/data
      - key: WALL_APP_PASSWORD
        generateValue: true
