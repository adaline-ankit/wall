services:
  - type: web
    name: margin-reading-ankit
    runtime: docker
    plan: free
    region: singapore
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: WALL_DATA_DIR
        value: /var/data
      - key: WALL_APP_PASSWORD
        generateValue: true
      - key: WALL_CAPTURE_TOKEN
        generateValue: true
